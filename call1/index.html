<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOMAD Badge</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:transparent; display:flex; align-items:center; justify-content:center; }
  .nm-wrap {
    width:100px; height:100px;
    border-radius:16px;
    background:#FFFFFF; border:1px solid #E4E4E1;
    overflow:hidden;
    position:relative;
    font-family:'Montserrat',sans-serif;
  }
  .nm-screen {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:5px;
    opacity:0;
    transition:opacity .35s ease;
  }
  .nm-screen.active { opacity:1; }

  .s0-logo { font-size:13px; font-weight:700; letter-spacing:.12em; color:#1A1A18; }
  .s0-logo span { color:#35AD73; }
  .s0-sub { font-size:7px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:#B0B0A8; }

  .s1-bubble {
    background:#F6F6F5; border-radius:8px 8px 8px 2px;
    padding:6px 8px; max-width:78px;
    font-size:7.5px; font-weight:600; color:#1A1A18;
    line-height:1.4; text-align:left;
    opacity:0; transform:translateY(4px);
    transition:opacity .3s, transform .3s;
  }
  .s1-bubble.in { opacity:1; transform:translateY(0); }
  .s1-cursor { color:#35AD73; animation:bl .85s infinite; }
  @keyframes bl{0%,100%{opacity:1}50%{opacity:0}}

  .s2-label { font-size:7px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:#35AD73; }
  .s2-dots { display:flex; gap:5px; }
  .s2-dot { width:6px; height:6px; border-radius:50%; background:#35AD73; opacity:.2; animation:dp 1.2s infinite; }
  .s2-dot:nth-child(2){animation-delay:.2s}
  .s2-dot:nth-child(3){animation-delay:.4s}
  .s2-dot:nth-child(4){animation-delay:.6s}
  @keyframes dp{0%,80%,100%{opacity:.2}40%{opacity:1}}

  .s3-rows { display:flex; flex-direction:column; gap:4px; width:80px; }
  .s3-row { height:8px; border-radius:3px; background:#F6F6F5; overflow:hidden; position:relative; }
  .s3-fill { position:absolute; left:0; top:0; bottom:0; border-radius:3px; width:0; transition:width .7s cubic-bezier(.4,0,.2,1); }
  .s3-tag { font-size:7px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; background:#EAF7F1; color:#0F5C3A; padding:2px 6px; border-radius:20px; }

  .s4-line { font-size:7.5px; font-weight:600; color:#1A1A18; text-align:center; line-height:1.5; max-width:80px; opacity:0; transform:translateY(3px); transition:opacity .3s, transform .3s; }
  .s4-line.in { opacity:1; transform:translateY(0); }
  .s4-green { color:#35AD73; font-weight:700; }

  .nm-nav { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); display:flex; gap:3px; }
  .nm-ndot { width:4px; height:4px; border-radius:50%; background:#D4D4CE; transition:all .3s; }
  .nm-ndot.on { background:#35AD73; width:10px; border-radius:2px; }
</style>
</head>
<body>
<div class="nm-wrap">
  <div class="nm-screen active" id="s0">
    <div class="s0-logo">NO<span>M</span>AD</div>
    <div class="s0-sub">Raccontaci di te</div>
  </div>
  <div class="nm-screen" id="s1">
    <div class="s1-bubble" id="sb1"></div>
  </div>
  <div class="nm-screen" id="s2">
    <div class="s2-label">Analisi</div>
    <div class="s2-dots">
      <div class="s2-dot"></div><div class="s2-dot"></div>
      <div class="s2-dot"></div><div class="s2-dot"></div>
    </div>
  </div>
  <div class="nm-screen" id="s3">
    <div class="s3-rows">
      <div class="s3-row"><div class="s3-fill" id="sf1" style="background:#35AD73"></div></div>
      <div class="s3-row"><div class="s3-fill" id="sf2" style="background:#6B5CE7"></div></div>
      <div class="s3-row"><div class="s3-fill" id="sf3" style="background:#E8960A"></div></div>
    </div>
    <div class="s3-tag">Capito.</div>
  </div>
  <div class="nm-screen" id="s4">
    <div class="s4-line" id="sl1">Prima capiamo.<br>Poi <span class="s4-green">agiamo.</span></div>
  </div>
  <div class="nm-nav">
    <div class="nm-ndot on" id="nd0"></div>
    <div class="nm-ndot" id="nd1"></div>
    <div class="nm-ndot" id="nd2"></div>
    <div class="nm-ndot" id="nd3"></div>
    <div class="nm-ndot" id="nd4"></div>
  </div>
</div>
<script>
function delay(ms){return new Promise(r=>setTimeout(r,ms));}
function show(n){
  [0,1,2,3,4].forEach(i=>{
    document.getElementById('s'+i).classList.toggle('active',i===n);
    document.getElementById('nd'+i).classList.toggle('on',i===n);
  });
}
async function run(){
  show(0);
  await delay(1400);

  show(1);
  const bub=document.getElementById('sb1');
  const txt='Chi sei e come lavori?';
  bub.innerHTML='<span class="s1-cursor">|</span>';
  bub.classList.add('in');
  for(let i=1;i<=txt.length;i++){
    bub.innerHTML=txt.slice(0,i)+(i<txt.length?'<span class="s1-cursor">|</span>':'');
    await delay(45);
  }
  await delay(700);

  show(2);
  await delay(1400);

  show(3);
  document.getElementById('sf1').style.width='0';
  document.getElementById('sf2').style.width='0';
  document.getElementById('sf3').style.width='0';
  await delay(100);
  document.getElementById('sf1').style.width='82%';
  await delay(200);
  document.getElementById('sf2').style.width='65%';
  await delay(200);
  document.getElementById('sf3').style.width='91%';
  await delay(1400);

  show(4);
  await delay(80);
  document.getElementById('sl1').classList.add('in');
  await delay(2200);

  document.getElementById('sl1').classList.remove('in');
  await delay(350);
  run();
}
run();
</script>
</body>
</html>
