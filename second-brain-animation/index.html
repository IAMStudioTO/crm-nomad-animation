<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Brain — System Map</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

  :root{
    --ink:#f4f8f2; --dim:rgba(255,255,255,.62);
    --line:rgba(255,255,255,.28); --glass:rgba(255,255,255,.10);
    --accent:#eaffd6; --accent-soft:rgba(255,255,255,.22);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:transparent;}
  body{
    background:transparent;
    color:var(--ink); font-family:'Montserrat',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100%; overflow:hidden;
  }
  .scene{position:relative; z-index:2; width:500px; height:500px; transform:translate(var(--shift-x,0px),var(--shift-y,0px)) scale(var(--fit,1)); transform-origin:center center;}

  .eyebrow{position:absolute; top:0; left:50%; transform:translateX(-50%);
    font-family:'Montserrat',sans-serif; font-size:11px; letter-spacing:.34em; color:var(--dim); text-transform:uppercase;
    opacity:0; animation:rise .8s ease forwards .1s; white-space:nowrap;}
  .eyebrow b{color:var(--accent); font-weight:500;}
  .headline{position:absolute; top:24px; left:50%; transform:translateX(-50%);
    font-size:29px; font-weight:600; letter-spacing:-.01em; text-align:center; white-space:nowrap;
    opacity:0; animation:rise .8s ease forwards .22s;}
  @keyframes rise{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

  /* one full-stage svg holds core-link + chart so geometry stays aligned */
  .scene{perspective:1100px;}
  .stage{position:absolute; inset:0; transform-style:preserve-3d;}
  .stage svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible;
    transform:rotateX(20deg) rotateZ(-3deg); transform-origin:50% 50%;
    filter:drop-shadow(0 36px 40px rgba(0,0,0,.55));}

  .corebox{position:absolute; top:50%; transform:transl(-50%,-50%);
    width:188px; height:188px; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(160deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.35);
    backdrop-filter:blur(7px) saturate(115%); -webkit-backdrop-filter:blur(7px) saturate(115%);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.40), inset 0 -18px 36px rgba(255,255,255,.04), 0 30px 70px rgba(0,0,0,.6), 0 0 40px rgba(160,230,150,.12);
    opacity:0; animation:coreIn 1s cubic-bezier(.2,.9,.25,1) forwards .35s;}
  @keyframes coreIn{to{opacity:1;}}
  .corebox .ring{position:absolute; inset:-1px; border-radius:50%; border:1px solid var(--accent-soft);}
  .corebox .ping{position:absolute; inset:0; border-radius:50%; border:1px solid var(--accent); opacity:0; animation:ping 3.6s ease-out infinite 1.4s;}
  @keyframes ping{0%{opacity:.45;transform:scale(1);}100%{opacity:0;transform:scale(1.4);}}
  .corebox .mono{font-family:'Montserrat',sans-serif;font-size:8px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;}
  .corebox .name{font-size:16px;font-weight:600;line-height:1.05;margin-top:6px;text-align:center;}
  .corebox .name span{display:block;color:var(--dim);font-size:10px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;margin-top:4px;}
  .corebox .pulse{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-bottom:10px;box-shadow:0 0 14px var(--accent);animation:breathe 2.4s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(.7);opacity:.5;}50%{transform:scale(1.15);opacity:1;}}

  .link{fill:none;stroke:var(--accent-soft);stroke-width:1.4;stroke-dasharray:4 4;opacity:0;animation:fadeIn .7s ease forwards 1.0s;}
  .spark{fill:var(--accent);opacity:0;}
  .spark.go{animation:spark 1.7s cubic-bezier(.5,0,.5,1) infinite 1.4s;}
  @keyframes spark{0%{opacity:0;offset-distance:0%;}12%{opacity:1;}88%{opacity:1;}100%{opacity:0;offset-distance:100%;}}

  .track{fill:none;stroke:rgba(255,255,255,.10);stroke-width:28;}
  .disc{opacity:0; animation:discIn 1.1s ease forwards .15s;}
  @keyframes discIn{to{opacity:1;}}
  .refring{fill:none;stroke:rgba(255,255,255,.045);stroke-width:1;}
  .sweep{fill:none;stroke-width:28;stroke-linecap:round;
    stroke-dasharray:var(--len) 999; stroke-dashoffset:var(--len);
    animation:sweep 1s cubic-bezier(.55,0,.1,1) forwards var(--delay);}
  @keyframes sweep{to{stroke-dashoffset:0;}}
  .node{fill:var(--accent);opacity:0;animation:pop .4s ease forwards var(--ndelay);}
  @keyframes pop{from{opacity:0;}to{opacity:1;}}
  .tick{stroke:rgba(255,255,255,.45);stroke-width:1;}
  .lead{stroke:rgba(255,255,255,.40);stroke-width:1;stroke-dasharray:2 3;opacity:0;animation:fadeIn .5s ease forwards var(--ldelay);}
  @keyframes fadeIn{to{opacity:1;}}
  .hubtext{font-family:'Montserrat',sans-serif;}
  .beam{opacity:0; animation:beamIn .6s ease forwards var(--bmdelay);}
  @keyframes beamIn{to{opacity:.14;}}
  .beam.flow{opacity:0; animation:beamShow .4s ease forwards var(--flowdelay), flow 2.4s ease-in-out infinite var(--flowdelay);}
  @keyframes beamShow{to{opacity:1;}}
  @keyframes flow{
    0%{stroke-dashoffset:var(--dash);}
    50%{stroke-dashoffset:0;}
    100%{stroke-dashoffset:var(--dash);}
  }

  .label{position:absolute; white-space:nowrap; font-size:15px; font-weight:600;
    display:flex; align-items:center; gap:8px; opacity:0; animation:lrise .55s ease forwards var(--ldelay);}
  @keyframes lrise{from{opacity:0;transform:translate(var(--tx),calc(-50% + 6px));}to{opacity:1;transform:translate(var(--tx),-50%);}}
  .label .idx{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.1em;}
  .label .pct{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:500;color:var(--dim);}
  .label .glow{width:11px;height:11px;border-radius:50%;flex-shrink:0;
    background:var(--c); box-shadow:0 0 10px var(--c),0 0 18px var(--c);
    animation:blink 2.2s ease-in-out infinite var(--bdelay);}
  @keyframes blink{0%,100%{opacity:.35;box-shadow:0 0 4px var(--c);}50%{opacity:1;box-shadow:0 0 12px var(--c),0 0 22px var(--c);}}
  .label .ltxt{line-height:1.12;}
  .label.l{flex-direction:row;}

  .corebox .logo{position:absolute; top:50%; left:50%; width:42%; height:auto;
    transform:translate(-50%,-50%); opacity:0;
    filter:drop-shadow(0 0 8px rgba(180,255,150,.35));
    animation:logoIn .8s cubic-bezier(.2,.9,.25,1) forwards 1s;}
  .corebox .logo path{fill:#f4fff0;}
  @keyframes logoIn{from{opacity:0;transform:translate(-50%,-46%) scale(.8);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}

  .footer{position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    font-family:'Montserrat',sans-serif;font-size:11px;color:var(--dim);letter-spacing:.12em;
    opacity:0; animation:rise .8s ease forwards 3.7s; display:flex; align-items:center;}
  .footer .bar{display:inline-block;width:150px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-left:14px;position:relative;overflow:hidden;}
  .footer .bar::after{content:"";position:absolute;inset:0;width:0;background:var(--accent);border-radius:2px;animation:load 3.1s ease-out forwards .6s;}
  @keyframes load{to{width:100%;}}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-delay:0s!important;}}
</style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="stage">
      <svg id="chart" preserveAspectRatio="xMidYMid meet" viewBox="0 0 640 640"></svg>
      <div class="corebox" id="corebox">
        <div class="ring"></div><div class="ping"></div>
        <svg class="logo" viewBox="0 0 376 376" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 375.944H67.8867L188.14 132.942L279.976 318.96C262.837 318.96 245.698 318.96 228.559 318.96C215.104 337.992 201.594 356.968 188.14 376H376L188.14 0L0 376V375.944Z" fill="white"/>
        </svg>
      </div>
    </div>
  </div>

<script>
const areas=[
  {id:"01",label:"Management",pct:"24%",color:"#f2ffe0"},
  {id:"02",label:"Sales",pct:"19%",color:"#d8ffac"},
  {id:"03",label:"Magazzino",pct:"14%",color:"#bdf589"},
  {id:"04",label:"Risorse Umane",pct:"12%",color:"#9ee07a"},
  {id:"05",label:"Customer Care",pct:"17%",color:"#7fd08f"},
  {id:"06",label:"Produzione",pct:"14%",color:"#e9ffe9"},
];
const NS="http://www.w3.org/2000/svg";
const chart=document.getElementById("chart");
const scene=document.getElementById("scene");
const corebox=document.getElementById("corebox");

// layout in viewBox coords (640x640)
const coreX=320, coreY=315, coreR=50;
const cx=320, cy=315, R=104, C=2*Math.PI*R;
const n=areas.length, seg=C/n, gap=40, len=seg-gap;
const startAngle=-90;

// --- 3D projection matching CSS: rotateX(52deg) rotateZ(-8deg), perspective 1100 ---
const RX=20*Math.PI/180, RZ=-3*Math.PI/180, PERSP=1100;
function project(vx,vy){
  const rect=chart.getBoundingClientRect();
  const s=Math.min(rect.width,rect.height)/640; // uniform scale (preserveAspectRatio=meet)
  // to px, centered on transform-origin (chart center 320,320)
  let X=(vx-320)*s, Y=(vy-320)*s, Z=0;
  // rotateZ
  let x1=X*Math.cos(RZ)-Y*Math.sin(RZ);
  let y1=X*Math.sin(RZ)+Y*Math.cos(RZ);
  // rotateX
  let y2=y1*Math.cos(RX)-Z*Math.sin(RX);
  let z2=y1*Math.sin(RX)+Z*Math.cos(RX);
  // perspective
  const f=PERSP/(PERSP-z2);
  const px=(rect.left-scene.getBoundingClientRect().left)+rect.width/2 + x1*f;
  const py=(rect.top-scene.getBoundingClientRect().top)+rect.height/2 + y2*f;
  return {x:px,y:py,depth:f};
}

// place core div centered on the disc's ACTUAL rendered center (accounts for CSS 3D perspective)
function place(){
  const rect=chart.getBoundingClientRect();
  const sceneRect=scene.getBoundingClientRect();
  const discEl=document.querySelector('.disc');
  let cxPx, cyPx;
  if(discEl){
    const d=discEl.getBoundingClientRect();
    cxPx=d.left+d.width/2-sceneRect.left;
    cyPx=d.top+d.height/2-sceneRect.top;
  }else{
    const p=project(coreX,coreY); cxPx=p.x; cyPx=p.y;
  }
  const s=Math.min(rect.width,rect.height)/640; // uniform scale (matches SVG preserveAspectRatio=meet)
  const bw=coreR*2*s, bh=coreR*2*s;
  corebox.style.left=(cxPx - bw*0.05)+"px";
  corebox.style.top=(cyPx - bh*0.10)+"px";
  corebox.style.width=bw+"px";
  corebox.style.height=bh+"px";
  corebox.style.transform="translate(-50%,-50%)";
}

// frosted glass disc behind the ring
const defs=document.createElementNS(NS,"defs");
defs.innerHTML=`
  <radialGradient id="glass" cx="42%" cy="36%" r="75%">
    <stop offset="0%" stop-color="rgba(255,255,255,0.30)"/>
    <stop offset="45%" stop-color="rgba(255,255,255,0.13)"/>
    <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
  </radialGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="1.2"/>
  </filter>`;
chart.appendChild(defs);
const disc=document.createElementNS(NS,"circle");
disc.setAttribute("cx",cx);disc.setAttribute("cy",cy);disc.setAttribute("r",R+44);
disc.setAttribute("fill","url(#glass)");
disc.setAttribute("stroke","rgba(255,255,255,0.30)");
disc.setAttribute("stroke-width","1.2");
disc.setAttribute("class","disc");
chart.appendChild(disc);

// track
const track=document.createElementNS(NS,"circle");
track.setAttribute("cx",cx);track.setAttribute("cy",cy);track.setAttribute("r",R);track.setAttribute("class","track");
chart.appendChild(track);

areas.forEach((a,i)=>{
  const arc=document.createElementNS(NS,"circle");
  arc.setAttribute("cx",cx);arc.setAttribute("cy",cy);arc.setAttribute("r",R);arc.setAttribute("class","sweep");
  arc.setAttribute("stroke",a.color);
  arc.style.transformOrigin=cx+"px "+cy+"px";
  arc.style.transform=`rotate(${(360/n)*i}deg)`;
  arc.style.setProperty("--len",len);
  arc.style.setProperty("--delay",(0.55+i*0.3)+"s");
  chart.appendChild(arc);

  // node dot at segment start
  const a0=(startAngle+(360/n)*i)*Math.PI/180;
  const nd=document.createElementNS(NS,"circle");
  nd.setAttribute("cx",cx+Math.cos(a0)*R);nd.setAttribute("cy",cy+Math.sin(a0)*R);
  nd.setAttribute("r","6");nd.setAttribute("class","node");
  nd.setAttribute("fill",a.color);
  nd.style.setProperty("--ndelay",(0.6+i*0.3)+"s");
  chart.appendChild(nd);

  // luminous connector beam from core edge toward slice mid (pulses back & forth)
  const midA=(startAngle+(360/n)*(i+0.5))*Math.PI/180;
  const bx1=cx+Math.cos(midA)*(coreR+6),  by1=cy+Math.sin(midA)*(coreR+6);
  const bx2=cx+Math.cos(midA)*(R-16),     by2=cy+Math.sin(midA)*(R-16);
  // faint base rail
  const rail=document.createElementNS(NS,"line");
  rail.setAttribute("x1",bx1);rail.setAttribute("y1",by1);rail.setAttribute("x2",bx2);rail.setAttribute("y2",by2);
  rail.setAttribute("stroke",a.color);rail.setAttribute("stroke-width","1.4");
  rail.setAttribute("stroke-linecap","round");rail.setAttribute("class","beam");
  rail.setAttribute("opacity","0.12");
  rail.style.setProperty("--bmdelay",(1.0+i*0.3)+"s");
  chart.appendChild(rail);
  // bright travelling pulse on top
  const pulse=document.createElementNS(NS,"line");
  pulse.setAttribute("x1",bx1);pulse.setAttribute("y1",by1);pulse.setAttribute("x2",bx2);pulse.setAttribute("y2",by2);
  pulse.setAttribute("stroke",a.color);pulse.setAttribute("stroke-width","2.6");
  pulse.setAttribute("stroke-linecap","round");pulse.setAttribute("class","beam flow");
  pulse.style.filter=`drop-shadow(0 0 5px ${a.color})`;
  const segLen=Math.hypot(bx2-bx1,by2-by1);
  pulse.setAttribute("stroke-dasharray",(segLen*0.32)+" "+segLen);
  pulse.style.setProperty("--dash",segLen);
  pulse.style.setProperty("--flowdelay",(1.1+i*0.22)+"s");
  chart.appendChild(pulse);

  const midRad=(startAngle+(360/n)*(i+0.5))*Math.PI/180;
  const x1=cx+Math.cos(midRad)*(R+40), y1=cy+Math.sin(midRad)*(R+40);
  const x2=cx+Math.cos(midRad)*(R+46), y2=cy+Math.sin(midRad)*(R+46);
  const tick=document.createElementNS(NS,"line");
  tick.setAttribute("x1",x1);tick.setAttribute("y1",y1);tick.setAttribute("x2",x2);tick.setAttribute("y2",y2);tick.setAttribute("class","tick");
  chart.appendChild(tick);
  const lx=cx+Math.cos(midRad)*(R+47), ly=cy+Math.sin(midRad)*(R+47);
  const lead=document.createElementNS(NS,"line");
  lead.setAttribute("x1",x2);lead.setAttribute("y1",y2);lead.setAttribute("x2",lx);lead.setAttribute("y2",ly);lead.setAttribute("class","lead");
  lead.style.setProperty("--ldelay",(0.7+i*0.3)+"s");
  chart.appendChild(lead);

  const onRight=Math.cos(midRad)>=0;
  const lbl=document.createElement("div");
  lbl.className="label "+(onRight?"r":"l");
  lbl.dataset.lx=lx; lbl.dataset.ly=ly; lbl.dataset.right=onRight?1:0; lbl.dataset.id=a.id;
  lbl.style.setProperty("--ldelay",(0.8+i*0.3)+"s");
  lbl.style.setProperty("--tx",onRight?"0":"-100%");
  lbl.style.setProperty("--c",a.color);
  lbl.style.setProperty("--bdelay",(i*0.42)+"s");
  const labelHTML = (a.id==="05"||a.id==="04") ? a.label.replace(" ","<br>") : a.label;
  lbl.innerHTML='<span class="glow"></span><span class="idx">'+a.id+'</span><span class="ltxt">'+labelHTML+'</span>';
  scene.appendChild(lbl);
});

function placeLabels(){
  const rect=chart.getBoundingClientRect();
  document.querySelectorAll('.label').forEach(l=>{
    const p=project(+l.dataset.lx, +l.dataset.ly);
    let pad = (+l.dataset.right)? 8 : -8;
    if(l.dataset.id==="06") pad -= 26; // shift Produzione left
    let voff = 0;
    if(l.dataset.id==="06"||l.dataset.id==="01") voff = -rect.height*0.05; // raise 5%
    if(l.dataset.id==="02") pad -= rect.width*0.03; // Sales: net 3% closer to circle
    l.style.left=(p.x+pad)+"px";
    l.style.top=(p.y+voff)+"px";
  });
}
function fitToViewport(){
  const sc=scene;
  sc.style.setProperty('--fit',1);
  sc.style.setProperty('--shift-x','0px');
  sc.style.setProperty('--shift-y','0px');

  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  const els=[sc, ...sc.querySelectorAll('.label')];
  els.forEach(e=>{
    const r=e.getBoundingClientRect();
    minX=Math.min(minX,r.left); minY=Math.min(minY,r.top);
    maxX=Math.max(maxX,r.right); maxY=Math.max(maxY,r.bottom);
  });

  const contentW=maxX-minX, contentH=maxY-minY;
  const pad=6;
  const fit=Math.min(1,(window.innerWidth-pad*2)/contentW,(window.innerHeight-pad*2)/contentH);
  const sceneRect=sc.getBoundingClientRect();
  const sceneCX=sceneRect.left+sceneRect.width/2;
  const sceneCY=sceneRect.top+sceneRect.height/2;
  const contentCX=(minX+maxX)/2;
  const contentCY=(minY+maxY)/2;
  const targetCX=window.innerWidth/2;
  const targetCY=window.innerHeight/2;
  const shiftX=targetCX-(sceneCX+(contentCX-sceneCX)*fit);
  const shiftY=targetCY-(sceneCY+(contentCY-sceneCY)*fit);

  sc.style.setProperty('--fit',fit.toFixed(4));
  sc.style.setProperty('--shift-x',shiftX.toFixed(2)+'px');
  sc.style.setProperty('--shift-y',shiftY.toFixed(2)+'px');
}
function layout(){
  scene.style.setProperty('--fit',1);
  scene.style.setProperty('--shift-x','0px');
  scene.style.setProperty('--shift-y','0px');
  place(); placeLabels();
  fitToViewport();
}
window.addEventListener('resize',layout);
window.addEventListener('load',()=>{layout(); setTimeout(layout,60);});
layout();
setTimeout(layout,60);
</script>
</body>
</html>
