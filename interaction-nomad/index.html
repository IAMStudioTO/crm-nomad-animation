<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOMAD – Network</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .scene {
      position: relative;
      width: 860px;
      height: 520px;
    }
    .lines-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .node-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: #35AD73;
      box-shadow: 0 10px 34px rgba(53,173,115,0.35), 0 0 0 10px rgba(53,173,115,0.08);
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .node-center img {
      width: 62px;
      height: 62px;
      object-fit: contain;
      filter: brightness(0) invert(1);
      transform: translateX(7px);
    }
    .node {
      position: absolute;
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: #35AD73;
      box-shadow: 0 4px 18px rgba(53,173,115,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: box-shadow 0.3s;
    }
    .node:hover { box-shadow: 0 8px 28px rgba(53,173,115,0.5); }
    .node img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }
  </style>
</head>
<body>
<div class="scene" id="scene">
  <svg class="lines-svg" id="lines"></svg>
  <div class="node-center">
    <img src="https://titan-nomad.ch/wp-content/uploads/2026/06/Mini-Logo-NOMAD.svg" alt="NOMAD">
  </div>
</div>

<script>
  const logos = [
    { name: 'Slack',        url: 'https://titan-nomad.ch/wp-content/uploads/2026/06/Logo-Slack.svg' },
    { name: 'Gmail',        url: 'https://titan-nomad.ch/wp-content/uploads/2026/06/Logo-GMail.svg' },
    { name: 'Salesforce',   url: 'https://titan-nomad.ch/wp-content/uploads/2026/06/Logo-Sales-Force.svg' },
    { name: 'Autocad',      url: 'https://titan-nomad.ch/wp-content/uploads/2026/06/Logo-Autocad.svg' },
    { name: 'Google Suite', url: 'https://titan-nomad.ch/wp-content/uploads/2026/06/Logo-Google-Suite.svg' },
    { name: 'Microsoft',    url: 'https://titan-nomad.ch/wp-content/uploads/2026/06/Logo-Microsoft.svg' },
    { name: 'HubSpot',      url: 'https://titan-nomad.ch/wp-content/uploads/2026/06/Logo-HubSpot.svg' },
    { name: 'OpenAI',       url: 'https://titan-nomad.ch/wp-content/uploads/2026/06/Logo-OpenAI.svg' },
    { name: 'Claude',       url: 'https://titan-nomad.ch/wp-content/uploads/2026/06/Logo-Claude.svg' },
    { name: 'Teams',        url: 'https://titan-nomad.ch/wp-content/uploads/2026/06/Logo-Teams.svg' },
  ];

  const W = 860, H = 520;
  const cx = W / 2, cy = H / 2;

  const positions = [
    { x: 219, y: 135 },
    { x: 360, y: 120 },
    { x: 500, y: 120 },
    { x: 633, y: 151 },
    { x: 648, y: 276 },
    { x: 609, y: 385 },
    { x: 461, y: 393 },
    { x: 305, y: 385 },
    { x: 204, y: 338 },
    { x: 196, y: 213 },
  ];

  const scene = document.getElementById('scene');
  const svgEl = document.getElementById('lines');

  const nodeEls = logos.map((logo, i) => {
    const div = document.createElement('div');
    div.className = 'node';
    div.style.left = (positions[i].x - 34) + 'px';
    div.style.top  = (positions[i].y - 34) + 'px';
    const img = document.createElement('img');
    img.src = logo.url;
    img.alt = logo.name;
    img.onerror = () => { img.style.display = 'none'; };
    div.appendChild(img);
    scene.appendChild(div);
    return div;
  });

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  svgEl.appendChild(defs);

  function pcbPath(x1, y1, x2, y2, mode) {
    if (mode === 0) return `M${x1},${y1} L${x2},${y1} L${x2},${y2}`;
    if (mode === 1) return `M${x1},${y1} L${x1},${y2} L${x2},${y2}`;
    const mx = (x1 + x2) / 2;
    return `M${x1},${y1} L${mx},${y1} L${mx},${y2} L${x2},${y2}`;
  }

  function pcbPts(x1, y1, x2, y2, mode) {
    if (mode === 0) return [{x:x1,y:y1},{x:x2,y:y1},{x:x2,y:y2}];
    if (mode === 1) return [{x:x1,y:y1},{x:x1,y:y2},{x:x2,y:y2}];
    const mx = (x1 + x2) / 2;
    return [{x:x1,y:y1},{x:mx,y:y1},{x:mx,y:y2},{x:x2,y:y2}];
  }

  function pathLen(pts) {
    let len = 0;
    for (let i = 1; i < pts.length; i++) {
      const dx = pts[i].x - pts[i-1].x, dy = pts[i].y - pts[i-1].y;
      len += Math.sqrt(dx*dx + dy*dy);
    }
    return len;
  }

  function pointOnPath(pts, t) {
    const total = pathLen(pts);
    let traveled = 0;
    const target = t * total;
    for (let i = 1; i < pts.length; i++) {
      const dx = pts[i].x - pts[i-1].x, dy = pts[i].y - pts[i-1].y;
      const seg = Math.sqrt(dx*dx + dy*dy);
      if (traveled + seg >= target) {
        const rem = (target - traveled) / seg;
        return { x: pts[i-1].x + dx * rem, y: pts[i-1].y + dy * rem };
      }
      traveled += seg;
    }
    return pts[pts.length - 1];
  }

  const modes = [0, 1, 2, 0, 1, 2, 0, 1, 2, 0];

  const connectors = logos.map((_, i) => {
    const gradId = 'grad' + i;
    const nx = positions[i].x, ny = positions[i].y;

    const grad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
    grad.setAttribute('id', gradId);
    grad.setAttribute('gradientUnits', 'userSpaceOnUse');
    grad.setAttribute('x1', cx); grad.setAttribute('y1', cy);
    grad.setAttribute('x2', nx); grad.setAttribute('y2', ny);
    const s1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
    s1.setAttribute('offset', '0%'); s1.setAttribute('stop-color', '#7DEBA3'); s1.setAttribute('stop-opacity', '0.1');
    const s2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
    s2.setAttribute('offset', '50%'); s2.setAttribute('stop-color', '#35AD73'); s2.setAttribute('stop-opacity', '0.75');
    const s3 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
    s3.setAttribute('offset', '100%'); s3.setAttribute('stop-color', '#7DEBA3'); s3.setAttribute('stop-opacity', '0.1');
    grad.appendChild(s1); grad.appendChild(s2); grad.appendChild(s3);
    defs.appendChild(grad);

    const d = pcbPath(cx, cy, nx, ny, modes[i]);

    const track = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    track.setAttribute('d', d);
    track.setAttribute('fill', 'none');
    track.setAttribute('stroke', '#35AD73');
    track.setAttribute('stroke-width', '1.2');
    track.setAttribute('stroke-dasharray', '4 4');
    track.setAttribute('opacity', '0.3');
    svgEl.appendChild(track);

    const glow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    glow.setAttribute('d', d);
    glow.setAttribute('fill', 'none');
    glow.setAttribute('stroke', `url(#${gradId})`);
    glow.setAttribute('stroke-width', '5');
    glow.setAttribute('stroke-linecap', 'round');
    svgEl.appendChild(glow);

    const pts = pcbPts(cx, cy, nx, ny, modes[i]);
    pts.slice(1, -1).forEach(p => {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
      c.setAttribute('r', '3'); c.setAttribute('fill', 'none');
      c.setAttribute('stroke', '#35AD73'); c.setAttribute('stroke-width', '1.5');
      c.setAttribute('opacity', '0.55');
      svgEl.appendChild(c);
    });

    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('r', '3');
    dot.setAttribute('fill', '#7DEBA3');
    dot.setAttribute('opacity', '0.95');
    svgEl.appendChild(dot);

    return { dot, pts, phase: Math.random() * Math.PI * 2, speed: 0.4 + Math.random() * 0.35 };
  });

  function animate(t) {
    const ts = t / 1000;
    connectors.forEach((conn) => {
      const prog = ((ts * conn.speed + conn.phase) % 1 + 1) % 1;
      const bp = pointOnPath(conn.pts, prog);
      conn.dot.setAttribute('cx', bp.x);
      conn.dot.setAttribute('cy', bp.y);
    });
    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>
</body>
</html>
