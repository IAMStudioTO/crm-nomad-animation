<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOMAD Data Hub</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, 'Helvetica Neue', sans-serif;
  overflow: hidden;
  min-height: 520px;
}
.scene { position:relative; width:680px; height:500px; }
.gc {
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.30);
  background: linear-gradient(140deg, rgba(255,255,255,0.17) 0%, rgba(255,255,255,0.07) 100%);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 0 0 0.5px rgba(255,255,255,0.10), inset 0 1px 0 rgba(255,255,255,0.20), 0 6px 18px rgba(0,0,0,0.10);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center;
  overflow:hidden;
}
.grid-bg {
  position:absolute; inset:0; border-radius:50%; pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size:18px 18px;
}
.gc-center {
  width:140px; height:140px;
  left:50%; top:50%;
  transform:translate(-50%, -50%);
  z-index:10;
  border:1px solid rgba(53,173,115,0.55);
  background: linear-gradient(140deg, rgba(53,173,115,0.22) 0%, rgba(53,173,115,0.08) 100%);
  animation: floatC 5s ease-in-out infinite;
}
@keyframes floatC { 0%,100%{transform:translate(-50%,-50%) translateY(0)} 50%{transform:translate(-50%,-50%) translateY(-6px)} }
.center-pulse {
  position:absolute; inset:-4px; border-radius:50%;
  border:0.5px solid rgba(53,173,115,0.4);
  animation: cpulse 2.8s ease-out infinite;
}
.center-pulse.p2 { animation-delay:0.9s; }
.center-pulse.p3 { animation-delay:1.8s; }
@keyframes cpulse {
  0%   { transform:scale(1); opacity:0.55; }
  100% { transform:scale(1.55); opacity:0; }
}
.center-label { font-size:15px; font-weight:600; color:rgba(255,255,255,0.96); z-index:1; line-height:1.2; }
.center-sub   { font-size:9px; color:rgba(53,173,115,0.9); margin-top:4px; letter-spacing:.06em; text-transform:uppercase; z-index:1; }
.gc-sat {
  width:108px; height:108px;
  z-index:5;
}
.s-crm   { left:108px; top:46px;  animation:fs1 5.5s ease-in-out infinite; }
.s-erp   { left:464px; top:46px;  animation:fs2 5.5s ease-in-out infinite 0.4s; }
.s-query { left:504px; top:228px; animation:fs3 5.5s ease-in-out infinite 0.8s; }
.s-rep   { left:108px; top:346px; animation:fs4 5.5s ease-in-out infinite 1.2s; }
.s-erp2  { left:464px; top:346px; animation:fs5 5.5s ease-in-out infinite 1.6s; }
.s-nl    { left:68px;  top:228px; animation:fs6 5.5s ease-in-out infinite 2s; }
@keyframes fs1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
@keyframes fs2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
@keyframes fs3 { 0%,100%{transform:translateX(0)} 50%{transform:translateX(5px)} }
@keyframes fs4 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(6px)} }
@keyframes fs5 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(5px)} }
@keyframes fs6 { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-5px)} }
.sat-icon  { font-size:22px; margin-bottom:6px; z-index:1; }
.sat-label { font-size:10px; font-weight:600; color:rgba(255,255,255,0.90); z-index:1; line-height:1.3; padding:0 8px; }
.sat-sub   { font-size:8.5px; color:rgba(255,255,255,0.48); margin-top:3px; z-index:1; padding:0 6px; line-height:1.3; }
.connectors { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.flow-dot {
  position:absolute; width:6px; height:6px; border-radius:50%;
  background: #35AD73;
  pointer-events:none;
  opacity:0;
}
.query-bubble {
  position:absolute;
  left:50%; bottom:14px;
  transform:translateX(-50%);
  background:rgba(53,173,115,0.14);
  border:0.5px solid rgba(53,173,115,0.38);
  border-radius:20px;
  padding:7px 18px;
  font-size:10px; color:rgba(255,255,255,0.78);
  white-space:nowrap;
  animation: qbubble 4s ease-in-out infinite;
  z-index:20;
}
.query-bubble em { color:rgba(160,240,200,0.9); font-style:normal; font-weight:500; }
@keyframes qbubble {
  0%,100% { opacity:0; transform:translateX(-50%) translateY(6px); }
  20%,75% { opacity:1; transform:translateX(-50%) translateY(0); }
  90%     { opacity:0; }
}
</style>
</head>
<body>

<div class="scene">

  <svg class="connectors" viewBox="0 0 680 500">
    <line x1="340" y1="250" x2="166" y2="104"  stroke="rgba(53,173,115,0.22)" stroke-width="0.8" stroke-dasharray="4 4"/>
    <line x1="340" y1="250" x2="518" y2="104"  stroke="rgba(53,173,115,0.22)" stroke-width="0.8" stroke-dasharray="4 4"/>
    <line x1="340" y1="250" x2="558" y2="283"  stroke="rgba(53,173,115,0.22)" stroke-width="0.8" stroke-dasharray="4 4"/>
    <line x1="340" y1="250" x2="166" y2="400"  stroke="rgba(53,173,115,0.22)" stroke-width="0.8" stroke-dasharray="4 4"/>
    <line x1="340" y1="250" x2="518" y2="400"  stroke="rgba(53,173,115,0.22)" stroke-width="0.8" stroke-dasharray="4 4"/>
    <line x1="340" y1="250" x2="122" y2="283"  stroke="rgba(53,173,115,0.22)" stroke-width="0.8" stroke-dasharray="4 4"/>
  </svg>

  <!-- CENTER: NOMAD -->
  <div class="gc gc-center">
    <div class="grid-bg"></div>
    <div class="center-pulse"></div>
    <div class="center-pulse p2"></div>
    <div class="center-pulse p3"></div>
    <div class="center-label">NOMAD</div>
    <div class="center-sub">AI Agent</div>
  </div>

  <!-- SATELLITES -->
  <div class="gc gc-sat s-crm">
    <div class="grid-bg"></div>
    <div class="sat-icon">⬡</div>
    <div class="sat-label">CRM</div>
    <div class="sat-sub">Clienti & pipeline</div>
  </div>

  <div class="gc gc-sat s-erp">
    <div class="grid-bg"></div>
    <div class="sat-icon">⬡</div>
    <div class="sat-label">ERP</div>
    <div class="sat-sub">Ordini & magazzino</div>
  </div>

  <div class="gc gc-sat s-query">
    <div class="grid-bg"></div>
    <div class="sat-icon">◎</div>
    <div class="sat-label">Linguaggio naturale</div>
    <div class="sat-sub">Fai domande dirette</div>
  </div>

  <div class="gc gc-sat s-rep">
    <div class="grid-bg"></div>
    <div class="sat-icon">⊞</div>
    <div class="sat-label">Report istantanei</div>
    <div class="sat-sub">Nessuna attesa</div>
  </div>

  <div class="gc gc-sat s-erp2">
    <div class="grid-bg"></div>
    <div class="sat-icon">◈</div>
    <div class="sat-label">Dati unificati</div>
    <div class="sat-sub">Un solo punto d'accesso</div>
  </div>

  <div class="gc gc-sat s-nl">
    <div class="grid-bg"></div>
    <div class="sat-icon">✦</div>
    <div class="sat-label">Risposta immediata</div>
    <div class="sat-sub">Nessun software da imparare</div>
  </div>

  <!-- Query bubble -->
  <div class="query-bubble">
    «Ordini aperti con ritardo pagamento &gt;30gg?» → <em>risposta istantanea</em>
  </div>

</div>

<script>
const lines = [
  { x1:340, y1:250, x2:166, y2:104 },
  { x1:340, y1:250, x2:518, y2:104 },
  { x1:340, y1:250, x2:558, y2:283 },
  { x1:340, y1:250, x2:166, y2:400 },
  { x1:340, y1:250, x2:518, y2:400 },
  { x1:340, y1:250, x2:122, y2:283 },
];
const scene = document.querySelector('.scene');
const sceneW = 680, sceneH = 500;

lines.forEach((l, i) => {
  [0, 0.5, 1].forEach(phase => {
    const dot = document.createElement('div');
    dot.className = 'flow-dot';
    scene.appendChild(dot);
    const dx = l.x2 - l.x1, dy = l.y2 - l.y1;
    const dur = 2200 + i * 120;
    let start = null;
    const delay = (i * 400 + phase * dur);
    function animate(ts) {
      if (!start) start = ts - delay % dur;
      const elapsed = (ts - start) % dur;
      const t = elapsed / dur;
      const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      const x = l.x1 + dx * ease;
      const y = l.y1 + dy * ease;
      const opacity = t < 0.08 ? t/0.08 : t > 0.88 ? (1-t)/0.12 : 1;
      dot.style.left = (x / sceneW * 100) + '%';
      dot.style.top  = (y / sceneH * 100) + '%';
      dot.style.opacity = opacity * 0.9;
      dot.style.transform = 'translate(-50%,-50%)';
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  });
});
</script>

</body>
</html>
