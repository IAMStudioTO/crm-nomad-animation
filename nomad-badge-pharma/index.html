<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOMAD — Badge Pharma</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  width: 200px; height: 200px;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}

.wrap {
  width: 200px; height: 200px;
  display: flex; align-items: center; justify-content: center;
  perspective: 600px;
}

@keyframes float {
  0%   { transform: rotateY(-12deg) rotateX(6deg) rotateZ(-2deg) translateY(0px); }
  50%  { transform: rotateY(-9deg) rotateX(8deg) rotateZ(-1deg) translateY(-5px); }
  100% { transform: rotateY(-12deg) rotateX(6deg) rotateZ(-2deg) translateY(0px); }
}

.badge {
  width: 160px; height: 160px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.42);
  position: relative; overflow: hidden;
  transform: rotateY(-12deg) rotateX(6deg) rotateZ(-2deg);
  box-shadow: 0 8px 18px rgba(0,0,0,0.3), 0 2px 5px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.55), inset 0 -1px 0 rgba(255,255,255,0.08);
  opacity: 0; transition: opacity 0.7s ease;
  font-family: 'Montserrat', sans-serif;
}
.badge.in { opacity: 1; animation: float 5s ease-in-out infinite; }

.shine { position: absolute; inset: 0; background: radial-gradient(ellipse at 40% 30%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 65%); border-radius: 50%; pointer-events: none; z-index: 3; }
.grid-bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px); background-size: 14px 14px; border-radius: 50%; z-index: 1; }

.phase-a { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 5px; padding: 20px; }
.num { font-size: 8px; font-weight: 600; letter-spacing: 0.12em; color: rgba(255,255,255,0.4); text-transform: uppercase; opacity: 0; transform: translateY(-5px); transition: opacity 0.4s ease, transform 0.4s ease; }
.num.in { opacity: 1; transform: translateY(0); }
.title { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.95); line-height: 1.2; opacity: 0; transform: translateY(5px); transition: opacity 0.5s ease, transform 0.5s ease; }
.title.in { opacity: 1; transform: translateY(0); }
.sep { width: 24px; height: 1px; background: rgba(255,255,255,0.25); transform: scaleX(0); transform-origin: center; transition: transform 0.5s ease; }
.sep.in { transform: scaleX(1); }
.subtitle { font-size: 8px; font-weight: 500; color: rgba(255,255,255,0.4); line-height: 1.4; text-align: center; opacity: 0; transition: opacity 0.4s ease; }
.subtitle.in { opacity: 1; }

.phase-b { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 16px 14px; opacity: 0; transition: opacity 0.4s ease; }
.phase-b.in { opacity: 1; }
.step { display: flex; align-items: center; gap: 6px; width: 100%; opacity: 0; transform: translateX(-8px); transition: opacity 0.35s ease, transform 0.35s ease; }
.step.in { opacity: 1; transform: translateX(0); }
.step-dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35); display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; color: rgba(255,255,255,0.8); }
.step-text { font-size: 8px; font-weight: 600; color: rgba(255,255,255,0.85); line-height: 1.3; }
.step-sub  { font-size: 7px; font-weight: 400; color: rgba(255,255,255,0.4); }
.connector { width: 1px; height: 8px; background: rgba(255,255,255,0.18); margin-left: 8px; transform: scaleY(0); transform-origin: top; transition: transform 0.3s ease; }
.connector.in { transform: scaleY(1); }

.phase-c { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 20px; opacity: 0; transition: opacity 0.5s ease; }
.phase-c.in { opacity: 1; }
.result-icon { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.35); display: flex; align-items: center; justify-content: center; font-size: 13px; transform: scale(0.5); transition: transform 0.5s cubic-bezier(0.34,1.5,0.64,1); }
.phase-c.in .result-icon { transform: scale(1); }
.result-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.95); line-height: 1.3; text-align: center; opacity: 0; transform: translateY(5px); transition: opacity 0.4s ease 0.2s, transform 0.4s ease 0.2s; }
.phase-c.in .result-label { opacity: 1; transform: translateY(0); }
.result-bullets { display: flex; flex-direction: column; gap: 4px; align-self: stretch; padding: 0 4px; opacity: 0; transition: opacity 0.4s ease 0.35s; }
.phase-c.in .result-bullets { opacity: 1; }
.rbullet { font-size: 7.5px; font-weight: 500; color: rgba(255,255,255,0.55); line-height: 1.3; display: flex; align-items: flex-start; gap: 5px; text-align: left; }
.rbullet::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.4); flex-shrink: 0; margin-top: 3px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="badge" id="badge">
    <div class="shine"></div>
    <div class="grid-bg"></div>

    <div class="phase-a" id="pa">
      <div class="num" id="el-num">Case Study 02</div>
      <div class="title" id="el-title">Settore<br>Pharma</div>
      <div class="sep" id="el-sep"></div>
      <div class="subtitle" id="el-sub">134 tabelle · CHF/EUR/USD</div>
    </div>

    <div class="phase-b" id="pb">
      <div class="step" id="s0">
        <div class="step-dot">1</div>
        <div><div class="step-text">Database complesso</div><div class="step-sub">134 tabelle multi-currency</div></div>
      </div>
      <div class="connector" id="c0"></div>
      <div class="step" id="s1">
        <div class="step-dot">2</div>
        <div><div class="step-text">NOMAD interroga</div><div class="step-sub">in italiano, zero SQL</div></div>
      </div>
      <div class="connector" id="c1"></div>
      <div class="step" id="s2">
        <div class="step-dot">3</div>
        <div><div class="step-text">Dati a tutti</div><div class="step-sub">senza passare dall'IT</div></div>
      </div>
    </div>

    <div class="phase-c" id="pc">
      <div class="result-icon">💊</div>
      <div class="result-label">Dati accessibili<br>a tutti</div>
      <div class="result-bullets">
        <div class="rbullet">Zero dipendenza dall'IT</div>
        <div class="rbullet">Query in linguaggio naturale</div>
      </div>
    </div>

  </div>
</div>

<script>
const d = ms => new Promise(r => setTimeout(r, ms));
function hide(id) { const e = document.getElementById(id); e.style.transition = 'none'; e.classList.remove('in'); }
function show(id, tr) { const e = document.getElementById(id); e.style.transition = tr; e.classList.add('in'); }

async function run() {
  ['badge','el-num','el-title','el-sep','el-sub','pb','s0','s1','s2','c0','c1','pc'].forEach(hide);
  document.getElementById('pa').style.opacity = '1';
  await d(100);

  const badge = document.getElementById('badge');
  badge.style.transition = 'opacity 0.7s ease'; badge.classList.add('in');
  await d(500);

  show('el-num', 'opacity 0.4s ease, transform 0.4s ease'); await d(180);
  show('el-title', 'opacity 0.5s ease, transform 0.5s ease'); await d(220);
  show('el-sep', 'transform 0.5s ease'); await d(200);
  show('el-sub', 'opacity 0.4s ease'); await d(1600);

  document.getElementById('pa').style.transition = 'opacity 0.4s ease';
  document.getElementById('pa').style.opacity = '0';
  await d(300);

  show('pb', 'opacity 0.3s ease'); await d(200);
  show('s0', 'opacity 0.35s ease, transform 0.35s ease'); await d(300);
  show('c0', 'transform 0.3s ease'); await d(200);
  show('s1', 'opacity 0.35s ease, transform 0.35s ease'); await d(300);
  show('c1', 'transform 0.3s ease'); await d(200);
  show('s2', 'opacity 0.35s ease, transform 0.35s ease'); await d(2000);

  document.getElementById('pb').style.transition = 'opacity 0.4s ease';
  document.getElementById('pb').style.opacity = '0';
  await d(300);

  show('pc', 'opacity 0.5s ease'); await d(3000);

  document.getElementById('pc').style.transition = 'opacity 0.4s ease';
  document.getElementById('pc').style.opacity = '0';
  document.getElementById('pa').style.transition = 'none';
  await d(400);
  run();
}

run();
</script>
</body>
</html>
